[project]
name = "campusflow-agentic-factory"
version = "0.1.0"
description = "CampusFlow product plus Google ADK Agentic Software Factory starter"
requires-python = ">=3.11"
dependencies = [
  "google-adk>=2.12.0,<3.0.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
